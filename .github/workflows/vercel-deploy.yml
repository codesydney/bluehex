name: Vercel Deploy

on:
  push:
    branches:
      - main

# Never let two production deploys race. A queued run supersedes the one waiting,
# but an in-flight deploy is allowed to finish rather than leaving a half-shipped build.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags: a major-version tag can be
      # retargeted, and this job holds VERCEL_TOKEN. Comments record the version each
      # SHA corresponds to; bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm/action-setup must come before setup-node, or the cache step finds no
      # lockfile it understands. Omitting `version` makes the action read
      # `packageManager` from package.json, so the pin cannot drift from local dev.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      # Read from `.nvmrc` rather than a literal, so this workflow cannot drift from
      # local development or from any other workflow. `engines.node` in package.json
      # states the same major and is what Vercel honours at runtime — it overrides the
      # value in Project Settings. This matters because `vercel deploy --prebuilt` ships
      # what is built here without rebuilding, so a build/runtime mismatch is caught
      # nowhere. Changing the major is an edit to `.nvmrc` and `engines.node`, nothing
      # else. Keep it to a major Vercel actually runs: 24.x, 22.x or 20.x.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # This installs the Vercel CLI too — it is a devDependency, not a separate global
      # `npm install`. That is deliberate. With `--prebuilt` the CLI generates the build
      # output that ships, so a CLI release changes what is deployed with no diff in this
      # repo; it is a build-time dependency, not a tool. As a devDependency its version
      # lives in pnpm-lock.yaml, which is where the release floor in pnpm-workspace.yaml
      # applies and where a bump arrives as a reviewable diff. A global npm install was
      # outside both, and held to the floor only by a comment asking the next person to
      # check publication dates by hand.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm exec`, not a bare `vercel`, so this runs the version in the lockfile rather
      # than whatever a runner image happens to have on PATH.
      - name: Pull Vercel environment information
        run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # This runs the Next.js production build; a build failure fails the deploy here.
      # That is also the only check in this job: CI on pull requests is #3 and making it
      # block a merge is #18, so until both land nothing stops a red commit reaching
      # production — `next build` no longer runs ESLint.
      - name: Build project artifacts
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
