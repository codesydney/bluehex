name: Vercel Deploy

on:
  push:
    branches:
      - main

# Never let two production deploys race. A queued run supersedes the one waiting,
# but an in-flight deploy is allowed to finish rather than leaving a half-shipped build.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup must come before setup-node, or the cache step finds no
      # lockfile it understands. Omitting `version` makes the action read
      # `packageManager` from package.json, so the pin cannot drift from local dev.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No lint or build check here on purpose: CI on pull requests is #3, and making it
      # block a merge is #18. Until both land, nothing stops a red commit reaching
      # production — `vercel build` runs `next build`, which no longer runs ESLint.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # This runs the Next.js production build; a build failure fails the deploy here.
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
