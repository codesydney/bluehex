name: Vercel Deploy

on:
  # Deploys follow the checks rather than the push, so a commit that fails `Quality` or
  # `Schema` never reaches production. `workflow_run` is the only way to order separate
  # workflows — a `needs:` cannot cross a workflow boundary — and it fires on every
  # completion, success or not, so the job below has to check the conclusion itself.
  #
  # Naming two workflows here does **not** mean "after both have passed". It means
  # "after either finishes", twice: one event per workflow, in whichever order they
  # land. The `Check the sibling workflow` step below is what turns that into an
  # ordering — each run looks up the other workflow's result at the same commit and
  # stands down if it has not finished, leaving the deploy to whichever event is last.
  #
  # Two consequences worth knowing. The workflow file is read from the default branch,
  # not from the commit being deployed, so a change to this file only takes effect once
  # it is on `main`. And `github.sha` here is `main`'s tip at trigger time rather than
  # the commit the checks validated, which is why the checkout below pins
  # `workflow_run.head_sha` — without that, a second merge landing mid-run would ship a
  # commit that nothing had checked.
  workflow_run:
    workflows: [CI, Schema]
    types: [completed]
    branches: [main]

  # Shipping is normally a consequence of landing on `main`, and that stays the rule.
  # This is for the case where the push happened and the run did not: a workflow
  # disabled by hand creates no run for a push received while it is off, not a queued
  # one, so re-enabling it afterwards leaves `main` ahead of production with nothing
  # to re-run and no way back except an empty commit. That happened on 15 August 2026
  # when the #63–#66 stack merged. Dispatch reconciles the two without writing a commit
  # whose only purpose is to be pushed.
  workflow_dispatch:

# Never let two production deploys race. A queued run supersedes the one waiting,
# but an in-flight deploy is allowed to finish rather than leaving a half-shipped build.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read
  # For the sibling check below, which reads this repository's workflow runs. Nothing
  # else in this job needs it, and `contents: read` does not imply it.
  actions: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    # Two gates in one condition, because the two triggers fail differently.
    #
    # `workflow_run` fires whenever CI or Schema completes, including when it failed or
    # was cancelled, so the conclusion has to be checked here or a red commit ships.
    # This covers the workflow that triggered the run; the step below covers the other
    # one. The `branches:` filter above already restricts it to `main`.
    #
    # A dispatch runs against whichever ref the caller picks in the dropdown, and every
    # step below passes `--prod` — so without the ref check, choosing any branch there
    # ships it to production. Both sit on the job rather than in a step, so a wrong ref
    # or a failed run costs a skipped run rather than a half-finished deploy.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      # The trigger fires once per workflow that finishes, so this runs twice for a
      # normal merge — once when `Quality` goes green and once when `Schema` does. Only
      # the last of the two should ship, and neither knows in advance which it is. So
      # each run asks after the other's result at the same commit and decides from that.
      #
      # It stands down rather than polling. This run exists because one workflow
      # finished; when the other finishes it fires an event of its own, and by then both
      # results are in. Waiting here would burn runner minutes reaching a state the next
      # event reaches for free.
      #
      # The failure mode of that is a duplicate deploy, not a missed one: if the two
      # conclude within the few seconds between this step and its sibling's, both see
      # the other as complete and both ship the same commit. The concurrency group above
      # orders those two rather than collapsing them — `cancel-in-progress: false` queues
      # the second run, it does not drop it — so the cost is one wasted build and a second
      # deployment record of an identical commit, not two deploys racing. That is the
      # right way round, and it is the trade for the reverse being impossible: both
      # standing down and `main` never shipping cannot happen, because a run's event is
      # delivered only after that run has concluded, and the lookup below is narrowed to
      # exactly one run per workflow per commit.
      #
      # Nothing here needs the repository, so it comes before the checkout.
      - name: Check the sibling workflow
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != 'workflow_run' ]; then
            echo "Dispatched by hand — there is no sibling run to read."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `TRIGGER` is matched on the workflow's `name:`, because that is what the event
          # payload carries and what the `workflows:` list above matches on. The sibling
          # is then identified by **file**, not by name: the file is the stable key, it is
          # what the API endpoints below take, and it cannot collide the way a display
          # name can. A third workflow added to the trigger list but not to this case
          # falls through to the catch-all and stops deploying — noisy, but it fails
          # closed.
          case "$TRIGGER" in
            CI)     sibling=Schema sibling_file=schema.yml ;;
            Schema) sibling=CI     sibling_file=ci.yml ;;
            *)
              echo "Triggered by an unrecognised workflow ($TRIGGER) — not deploying."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Scoped to the sibling's own workflow file *and* to `event=push`, which is what
          # makes "one run per workflow per commit" true and the paragraph above with it.
          # Without the event filter this matched any run at the commit, and a hand
          # dispatch of `Schema` against `main` produces a second run at the same
          # `head_sha` — newer, so it would win the lookup, and a cancelled one would
          # leave the commit deployed by nothing at all.
          run=$(gh api \
            "repos/$REPO/actions/workflows/$sibling_file/runs?head_sha=$HEAD_SHA&event=push&per_page=100" \
            --jq '.workflow_runs | first')

          if [ -z "$run" ] || [ "$run" = null ]; then
            # No sibling run for this commit. Two very different reasons, and conflating
            # them is how this gate would quietly stop applying.
            #
            #   - The workflow is `active` and simply did not match: `Schema` filters
            #     documentation-only pushes out with `paths-ignore`. Benign, and refusing
            #     to deploy on it would mean a documentation merge could never reach
            #     production.
            #   - The workflow is **disabled by hand**, in which case every code merge
            #     from here on ships with no schema signal — which is the hole this whole
            #     job exists to close, re-opened silently.
            #
            # Both still ship, because standing down would freeze production for as long
            # as the workflow stayed off, and that is a worse trap than shipping. But the
            # second gets a warning annotation, so the deploy says out loud that it was
            # not checked rather than reporting "nothing to wait for".
            state=$(gh api "repos/$REPO/actions/workflows/$sibling_file" --jq '.state')
            if [ "$state" = active ]; then
              echo "No $sibling run for $HEAD_SHA and $sibling_file is active — nothing to wait for."
            else
              echo "::warning title=Deploying without $sibling::$sibling_file is $state, so no run exists for $HEAD_SHA. Shipping unchecked by $sibling."
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(jq -r '.status' <<<"$run")
          conclusion=$(jq -r '.conclusion' <<<"$run")
          echo "$sibling at $HEAD_SHA: status=$status conclusion=$conclusion"

          if [ "$status" != completed ]; then
            echo "$sibling is still going — its own completion will deploy this commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$conclusion" in
            success)
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            skipped)
              # Every job in it filtered out by an `if:`. Nothing was checked and nothing
              # failed, which is the same position as no run at all.
              echo "$sibling was skipped — treating it as not run."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Red, cancelled or timed out. Stand down rather than fail this job: the
              # sibling is already reporting that failure against this commit, and a
              # second red X saying the same thing buys nothing.
              echo "$sibling concluded $conclusion — not deploying $HEAD_SHA."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Every step from here down carries the same condition, and a step skipped by it
      # reports Success — this run was simply not the one that ships.
      #
      # Actions are pinned to commit SHAs, not tags: a major-version tag can be
      # retargeted, and this job holds VERCEL_TOKEN. Comments record the version each
      # SHA corresponds to; bump both together.
      #
      # `ref` pins the exact commit the checks validated. On a `workflow_run` event the
      # default checkout is the default branch's tip, which is usually the same commit
      # and silently is not when two merges land close together — the failure mode being
      # a deploy of something no run ever checked. `github.sha` is the fallback for a
      # dispatch, where there is no triggering run to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # pnpm/action-setup must come before setup-node, or the cache step finds no
      # lockfile it understands. Omitting `version` makes the action read
      # `packageManager` from package.json, so the pin cannot drift from local dev.
      - name: Install pnpm
        if: steps.gate.outputs.deploy == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      # Read from `.nvmrc` rather than a literal, so this workflow cannot drift from
      # local development or from any other workflow. `engines.node` in package.json
      # states the same major and is what Vercel honours at runtime — it overrides the
      # value in Project Settings. This matters because `vercel deploy --prebuilt` ships
      # what is built here without rebuilding, so a build/runtime mismatch is caught
      # nowhere. Changing the major is an edit to `.nvmrc` and `engines.node`, nothing
      # else. Keep it to a major Vercel actually runs: 24.x, 22.x or 20.x.
      - name: Install Node
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # This installs the Vercel CLI too — it is a devDependency, not a separate global
      # `npm install`. That is deliberate. With `--prebuilt` the CLI generates the build
      # output that ships, so a CLI release changes what is deployed with no diff in this
      # repo; it is a build-time dependency, not a tool. As a devDependency its version
      # lives in pnpm-lock.yaml, which is where the release floor in pnpm-workspace.yaml
      # applies and where a bump arrives as a reviewable diff. A global npm install was
      # outside both, and held to the floor only by a comment asking the next person to
      # check publication dates by hand.
      - name: Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      # Schema before code, and inside the deploy rather than beside it.
      #
      # `db push` applies every migration in `supabase/migrations/` that the hosted
      # project's `schema_migrations` table does not already record, in filename order.
      # With nothing new it prints that the remote database is up to date and exits 0, so
      # this is a no-op on every deploy carrying no migration — a documentation merge, a
      # hand dispatch, a re-run.
      #
      # It lives in this job rather than in a `migrate.yml` of its own because this job is
      # the only place that already knows a commit is fit to ship: the gate above has
      # confirmed both `Quality` and `Schema` are green at exactly this SHA, and the
      # concurrency group serialises production so two merges cannot push migrations at
      # once. A workflow on `push: main` would apply schema at commits whose schema tests
      # had not passed — the one thing `schema.yml` exists to catch. Adding a third
      # workflow to the `workflow_run` trigger above is not the alternative either: the
      # sibling gate pairs exactly two workflows and anything else falls through its
      # `case` to the catch-all, which stops deploying entirely.
      #
      # Before the build rather than after the deploy, because the two failure modes are
      # not symmetric. A schema ahead of its code is what an additive migration is written
      # to tolerate — a table nothing reads yet. Code ahead of its schema is #53's exact
      # hazard: a deployed page querying tables that do not exist. So a failed push fails
      # the job here, before anything ships.
      #
      # No `supabase/setup-cli` step and nothing new on the Actions allowlist: the CLI is
      # a devDependency, so the install above has already put it on PATH at the version in
      # `pnpm-lock.yaml`, under the 7-day release floor and arriving as a reviewable diff.
      # `schema.yml` boots the test stack the same way, for the same reason.
      - name: Apply migrations to the hosted project
        if: steps.gate.outputs.deploy == 'true'
        env:
          # The first two are read by the CLI itself, so the password never reaches argv.
          # The third is this workflow's own name, handed to `--project-ref` below —
          # deliberately **not** `SUPABASE_PROJECT_ID`, which the CLI reads as an override
          # for `config.toml`'s `project_id` (`bluehex`, the local Docker project) and not
          # as the hosted project's ref. Two different identifiers, one letter apart.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          # An unset secret arrives as an empty string, and the CLI's own error for that
          # reads like a network or an auth problem. Name it instead: this is the step's
          # most likely first failure, because all three are account actions someone has
          # to perform by hand and none of them is visible in a diff.
          missing=
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "${SUPABASE_PROJECT_REF:-}" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error title=Supabase secrets missing::Set${missing} under Settings -> Secrets and variables -> Actions. See AGENTS.md, Deployment."
            exit 1
          fi

          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # Neither optional include is ever right here. `--include-seed` would run
          # `supabase/seed.sql` against production, and that file is local reference data
          # by construction. `--include-all` would apply migrations the remote history has
          # already skipped past, which is a repair to make deliberately and by hand, not
          # something to leave switched on for every deploy.
          pnpm exec supabase db push --linked --yes

      # `pnpm exec`, not a bare `vercel`, so this runs the version in the lockfile rather
      # than whatever a runner image happens to have on PATH.
      - name: Pull Vercel environment information
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # This runs the Next.js production build; a build failure fails the deploy here.
      # It is no longer the only check in this job, though: `Quality` and `Schema` have
      # both passed at this commit by the time these steps run, which is what the trigger
      # and the gate above are for.
      - name: Build project artifacts
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
